import net.fabricmc.loom.task.RunGameTask

plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.forge_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    compileOnly("cc.tweaked:cc-tweaked-$minecraft_version-core-api:$cct_version")
    modCompileOnly("cc.tweaked:cc-tweaked-$minecraft_version-forge-api:$cct_version")
    modRuntimeOnly("cc.tweaked:cc-tweaked-$minecraft_version-forge:$cct_version")

    include("io.github.jaredmdobson:concentus:1.0.2")
    // nightconfig is included in Forge

    // Fixes missing deps on Architectury Loom (architectury/architectury-loom#201)
    forgeRuntimeLibrary "cc.tweaked:cobalt:0.9.7"
    forgeRuntimeLibrary "com.jcraft:jzlib:1.1.3"
    forgeRuntimeLibrary "io.netty:netty-codec-http:4.1.82.Final"
    forgeRuntimeLibrary "io.netty:netty-codec-socks:4.1.82.Final"
    forgeRuntimeLibrary "io.netty:netty-handler-proxy:4.1.82.Final"
    forgeRuntimeLibrary("io.github.jaredmdobson:concentus:1.0.2")
    forgeRuntimeLibrary("com.electronwill.night-config:core:3.8.4")
    forgeRuntimeLibrary("com.electronwill.night-config:toml:3.8.4")
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
